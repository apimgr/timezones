name: timezones

services:
  timezones:
    image: ghcr.io/apimgr/timezones:latest
    container_name: timezones
    restart: unless-stopped
    environment:
      # Hardcoded with sane defaults - NO .env files
      - MODE=production
      - TZ=America/New_York
      # ENABLE_TOR=true is default, no need to specify
    ports:
      # Production: bound to Docker bridge only
      - "172.17.0.1:64580:80"
    volumes:
      - ./rootfs/config/timezones:/config
      - ./rootfs/data/timezones:/data
    networks:
      - timezones

networks:
  timezones:
    name: timezones
    external: false
